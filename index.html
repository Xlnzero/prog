<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Программируйте с нами</title>
<style>
  :root {
    --bg-top: #0a0e16;
    --bg-bottom: #151c2a;
    --text: #e8edf5;
    --accent: #3d6fa3;
    --accent-hover: #4d82ba;
    --accent-text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 24px;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(2.2rem, 7vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }
  .btn {
    pointer-events: auto;
    display: inline-block;
    padding: 16px 44px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    transition: background .2s, transform .2s;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <h1>Программируйте с нами</h1>
  <a class="btn" href="https://t.me/MidTeamLead">Записаться</a>
</main>

<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var RADIUS = 150;      // радиус влияния мыши, px
  var PUSH = 0.9;        // сила отталкивания
  var FRICTION = 0.94;   // затухание отталкивания
  var STAR_RGB = '184,196,214'; // цвет звёзд (серо-голубой)

  var stars = [];
  var mouse = { x: -9999, y: -9999 };
  var w, h, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.round((w * h) / 5000);
    stars = [];
    for (var i = 0; i < count; i++) {
      var r = Math.random() * 1.4 + 0.4;
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: 0, vy: 0,                 // импульс от мыши
        fall: 0.12 + r * 0.14,        // скорость падения (крупные чуть быстрее)
        r: r,
        phase: Math.random() * Math.PI * 2,
        twinkle: Math.random() * 0.02 + 0.005
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];

      if (!reduceMotion) {
        var dx = s.x - mouse.x, dy = s.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < RADIUS && dist > 0.1) {
          var force = (1 - dist / RADIUS) * PUSH;
          s.vx += (dx / dist) * force;
          s.vy += (dy / dist) * force;
        }
        s.vx *= FRICTION;
        s.vy *= FRICTION;
        s.x += s.vx;
        s.y += s.fall + s.vy;
        s.phase += s.twinkle;

        // ушла вниз — появляется сверху; вбок — с другой стороны
        if (s.y > h + 5) { s.y = -5; s.x = Math.random() * w; s.vx = s.vy = 0; }
        if (s.y < -50) { s.y = h + 5; }
        if (s.x < -10) s.x = w + 10;
        if (s.x > w + 10) s.x = -10;
      }

      var glow = 0.5 + 0.35 * Math.sin(s.phase);
      var near = Math.max(0, 1 - Math.hypot(s.x - mouse.x, s.y - mouse.y) / RADIUS);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + near * 1.0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + STAR_RGB + ',' + Math.min(1, glow * 0.8 + near * 0.2) + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('mousemove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', function (e) {
    var t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY;
  }, { passive: true });
  window.addEventListener('touchend', function () { mouse.x = mouse.y = -9999; });
  window.addEventListener('mouseout', function () { mouse.x = mouse.y = -9999; });
  window.addEventListener('resize', resize);

  resize();
  draw();
})();
</script>
</body>
</html>
