<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Программируйте с нами</title>
<style>
  :root {
    --bg: #070a1c;
    --text: #eef1ff;
    --accent: #ffc83d;
    --accent-text: #1a1400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #121a45 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 24px;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(2.2rem, 7vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.1;
    text-shadow: 0 0 40px rgba(120, 150, 255, 0.45);
  }
  .btn {
    pointer-events: auto;
    display: inline-block;
    padding: 16px 44px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1.15rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 0 0 0 rgba(255, 200, 61, 0.5);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 0 30px 4px rgba(255, 200, 61, 0.45); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <h1>Программируйте с нами</h1>
  <!-- Замените href на вашу ссылку: форму, Telegram, почту и т.д. -->
  <a class="btn" href="https://t.me/MidTeamLead">Записаться</a>
</main>

<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var RADIUS = 150;      // радиус влияния мыши, px
  var PUSH = 0.9;        // сила отталкивания
  var RETURN = 0.02;     // как быстро звезда возвращается на место
  var FRICTION = 0.9;

  var stars = [];
  var mouse = { x: -9999, y: -9999 };
  var w, h, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.round((w * h) / 4500);
    stars = [];
    for (var i = 0; i < count; i++) {
      var x = Math.random() * w, y = Math.random() * h;
      stars.push({
        hx: x, hy: y, x: x, y: y, vx: 0, vy: 0,
        r: Math.random() * 1.6 + 0.4,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];

      if (!reduceMotion) {
        var dx = s.x - mouse.x, dy = s.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < RADIUS && dist > 0.1) {
          var force = (1 - dist / RADIUS) * PUSH;
          s.vx += (dx / dist) * force;
          s.vy += (dy / dist) * force;
        }
        s.vx += (s.hx - s.x) * RETURN;
        s.vy += (s.hy - s.y) * RETURN;
        s.vx *= FRICTION;
        s.vy *= FRICTION;
        s.x += s.vx;
        s.y += s.vy;
        s.phase += s.speed;
      }

      var glow = 0.55 + 0.45 * Math.sin(s.phase);
      var near = Math.max(0, 1 - Math.hypot(s.x - mouse.x, s.y - mouse.y) / RADIUS);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + near * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + (230 + near * 25) + ',' + (235 - near * 30) + ',255,' + (glow * 0.85 + near * 0.15) + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('mousemove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', function (e) {
    var t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY;
  }, { passive: true });
  window.addEventListener('touchend', function () { mouse.x = mouse.y = -9999; });
  window.addEventListener('mouseout', function () { mouse.x = mouse.y = -9999; });
  window.addEventListener('resize', resize);

  resize();
  draw();
})();
</script>
</body>
</html>
